<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<title>Drone Swarm Coordinator</title>
<style>
  :root {
    --bg: #eef1f5; --surface: #ffffff; --surface-alt: #f4f6f9;
    --ink: #101828; --muted: #5d6b82; --border: #dde3ea; --accent: #1b4965;
    --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Roboto Mono", monospace;
    --font-sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0f14; --surface:#131a22; --surface-alt:#0f151c; --ink:#e6ebf0; --muted:#93a1b4; --border:#263241; --accent:#6fb3d9; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 3rem 1.25rem; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: flex; justify-content: center; }
  main { max-width: 640px; width: 100%; }

  .top-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  .eyebrow { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); font-weight: 700; margin: 0 0 0.5rem 0; }
  h1 { margin: 0 0 0.4rem 0; font-size: 1.55rem; font-weight: 700; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); margin: 0 0 1.75rem 0; font-size: 0.95rem; line-height: 1.5; }

  .lang-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .lang-switch a { background: var(--surface); color: var(--muted); padding: 0.35rem 0.6rem; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; text-decoration: none; letter-spacing: 0.02em; }
  .lang-switch a + a { border-left: 1px solid var(--border); }
  .lang-switch a[aria-current="true"] { background: var(--accent); color: var(--surface); }

  section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.25rem; }
  h2 { margin: 0 0 0.6rem 0; font-size: 1.05rem; }

  label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 0.35rem; }
  input[type="number"] { width: 8rem; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-alt); color: var(--ink); margin-bottom: 0.9rem; font-family: var(--font-sans); font-size: 0.9rem; }

  button { background: var(--accent); color: var(--surface); border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-family: var(--font-sans); font-size: 0.95rem; font-weight: 700; cursor: pointer; }
  button:hover { filter: brightness(1.1); }

  .limits { font-size: 0.82rem; color: var(--muted); line-height: 1.5; border-left: 3px solid var(--border); padding-left: 0.9rem; }
</style>
</head>
<body>
<main>
  <div class="top-bar">
    <p class="eyebrow">Drone Swarm Coordinator</p>
    <div class="lang-switch" role="group" aria-label="Idioma / Language / Sprache">
      <a href="/?lang=es" aria-current="{{ 'true' if lang == 'es' else 'false' }}">ES</a>
      <a href="/?lang=en" aria-current="{{ 'true' if lang == 'en' else 'false' }}">EN</a>
      <a href="/?lang=de" aria-current="{{ 'true' if lang == 'de' else 'false' }}">DE</a>
    </div>
  </div>
  <h1>{{ labels.index_h1 }}</h1>
  <p class="subtitle">{{ labels.index_subtitle }}</p>

  {% for scenario in scenarios %}
  <section>
    <h2>{{ scenario.label }}</h2>
    <form action="/run" method="get">
      <input type="hidden" name="scenario" value="{{ scenario.id }}">
      <input type="hidden" name="lang" value="{{ lang }}">
      <label for="ticks-{{ scenario.id }}">{{ labels.ticks_label }}</label>
      <input type="number" id="ticks-{{ scenario.id }}" name="ticks" value="{{ scenario.default_ticks }}" min="5" max="600">
      <div><button type="submit">{{ labels.run_button }}</button></div>
    </form>
  </section>
  {% endfor %}

  <p class="limits">{{ labels.limits_text }}</p>
</main>
</body>
</html>
